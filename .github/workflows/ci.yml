name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, test, coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # Same as infra/web.Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine # Same as the db service of docker-compose.yml
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: gym2_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d gym2_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: true
      E2E_DATABASE_URL: postgresql://admin:dev_password@localhost:5432/gym2_e2e
      E2E_PYTHON: python
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14" # Same as infra/backend.Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - name: Apply the Flyway migrations
        run: >-
          docker run --rm --network host -v "$PWD/../backend/db/migrations:/flyway/sql" flyway/flyway:13-alpine
          -url=jdbc:postgresql://localhost:5432/gym2_e2e -user=admin -password=dev_password -connectRetries=60 migrate
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # Same as infra/web.Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  backend:
    name: Backend (ruff, mypy, migrations, pytest, coverage)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine # Same as the db service of docker-compose.yml
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: gym2_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d gym2_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://admin:dev_password@localhost:5432/gym2_db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14" # Same as infra/backend.Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Typecheck (mypy)
        run: mypy
      - name: Apply the Flyway migrations
        run: >-
          docker run --rm --network host -v "$PWD/db/migrations:/flyway/sql" flyway/flyway:13-alpine
          -url=jdbc:postgresql://localhost:5432/gym2_db -user=admin -password=dev_password -connectRetries=60 migrate
      - name: Test (pytest with coverage)
        run: pytest --cov

  ios:
    name: iOS (build, unit tests)
    runs-on: macos-26
    timeout-minutes: 45 # xcodebuild can hang after a failed test run
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,ds in sorted(d.items(), reverse=True) if "iOS" in r for x in ds if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Build and test
        run: >-
          xcodebuild test
          -project "ios/Gym 2.0.xcodeproj"
          -scheme "Gym 2.0"
          -destination "id=$SIMULATOR_UDID"
          -enableCodeCoverage YES
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Coverage
        # Fails below the minimum line coverage of the app, raise it when the coverage grows
        env:
          MIN_COVERAGE: "22"
        run: |
          xcrun xccov view --report --only-targets TestResults.xcresult
          xcrun xccov view --report --only-targets --json TestResults.xcresult \
            | python3 -c 'import json,os,sys; t=next(t for t in json.load(sys.stdin) if t["name"]=="Gym 2.0.app"); c=100*t["lineCoverage"]; m=float(os.environ["MIN_COVERAGE"]); print(f"Gym 2.0.app: {c:.1f}% of the lines (minimum {m}%)"); sys.exit(c<m)'

  backup:
    name: Backup and restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: infra/backup/test-restore.sh

  docker:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: # The images of docker-compose.prod.yml, and the offsite backup server
          - { name: web, context: ., dockerfile: infra/web.Dockerfile, target: runner }
          - { name: backend, context: ., dockerfile: infra/backend.Dockerfile, target: "" }
          - { name: mailserver, context: ., dockerfile: infra/mailserver/Dockerfile, target: "" }
          - { name: backup, context: ., dockerfile: infra/backup/Dockerfile, target: "" }
          - { name: offsite-backup, context: infra/offsite-backup, dockerfile: infra/offsite-backup/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
