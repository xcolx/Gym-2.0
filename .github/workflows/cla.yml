# Asks the author of every pull request into main to sign CLA.md once. The signatures are stored in
# signatures/cla.json on the cla-signatures branch, and the "CLA" check is required on main.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
    branches: [main]

permissions:
  actions: write
  contents: write # Commits the signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    # Comments on issues don't concern the CLA, only those on pull requests that sign it or ask to check it again
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # Doesn't check out or run any code of the pull request, which pull_request_target would allow with write access
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/xcolx/Gym-2.0/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: xcolx,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
