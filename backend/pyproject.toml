[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Long lines (field descriptions, HTML, aligned comments) are left to review, no formatter is run
    "B008",  # FastAPI declares its dependencies as Depends(...) defaults
    "UP037", # Quoted forward references stay, SQLAlchemy and pydantic resolve them at runtime
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# CI runs pytest --cov and fails below this, raise it when the coverage grows
fail_under = 94
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_equality = true
enable_error_code = ["ignore-without-code"]
mypy_path = [".", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*"]  # Ships without type information
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
